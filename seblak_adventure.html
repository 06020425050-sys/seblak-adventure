    /* Steam Animation */
    @keyframes steam {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-30px) scaleX(1.5); opacity: 0; }
    }
    .steam-1 { animation: steam 2.5s infinite ease-out; }
    .steam-2 { animation: steam 2.5s infinite ease-out 0.8s; }
    .steam-3 { animation: steam 2.5s infinite ease-out 1.6s; }

    /* Floating Animation */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }
    .float-item { animation: floatSlow 3s ease-in-out infinite; }
    .float-item-delay { animation: floatSlow 3.5s ease-in-out infinite 1s; }

    /* Pulse Glow */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.9)); transform: scale(1.03); }

    .btn-pulse { animation: pulseGlow 2s infinite ease-in-out; }

  <!-- WEB AUDIO API SYNTHESIZER SCRIPT -->
  <script>
    // Audio Context State
    let audioCtx = null;
    let isMuted = false;
    let bgmInterval = null;
    let isBgmPlaying = false;

    // Initialize Web Audio Context
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Unlock Audio explicitly on first touch / click
    function unlockAudio() {
      initAudio();
      document.getElementById('audio-unlock-overlay').classList.add('hidden');
      playPopSFX();
      startBGM();
    }

    // Global click listener to unlock audio if user clicks anywhere on page
    window.addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: true });

    // SFX Pop / Click Synth (High pitch 800Hz -> 200Hz drop)
    function playPopSFX() {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        const now = audioCtx.currentTime;

        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.09);
      } catch (e) {
        console.error("Audio SFX Error:", e);
      }
    }

    // Cheerful Chiptune BGM Generator using Web Audio API Synth
    const BGM_NOTES = [
      261.63, 329.63, 392.00, 523.25, // C4, E4, G4, C5
      349.23, 440.00, 523.25, 698.46, // F4, A4, C5, F5
      392.00, 493.88, 587.33, 783.99, // G4, B4, D5, G5
      523.25, 392.00, 329.63, 261.63  // C5, G4, E4, C4
    ];
    let noteIndex = 0;

    function playBgmNote() {
      if (isMuted || !audioCtx || !isBgmPlaying) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle'; // Happy chiptune timbre
        const freq = BGM_NOTES[noteIndex % BGM_NOTES.length];
        const now = audioCtx.currentTime;

        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.2);

        noteIndex++;
      } catch (e) {
        console.error("BGM Error:", e);
      }
    }

    function startBGM() {
      if (isBgmPlaying) return;
      isBgmPlaying = true;
      if (bgmInterval) clearInterval(bgmInterval);
      bgmInterval = setInterval(playBgmNote, 220); // Cheerful tempo
    }

    function toggleSound() {
      initAudio();
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const btn = document.getElementById('sound-btn');

      if (isMuted) {
        icon.textContent = '🔇';
        btn.classList.replace('bg-red-500', 'bg-gray-500');
      } else {
        icon.textContent = '🔊';
        btn.classList.replace('bg-gray-500', 'bg-red-500');
        playPopSFX();
      }
    }

    // Page Navigation Router
    function goToPage(pageNumber) {
      playPopSFX();
      
      // Hide all pages
      document.querySelectorAll('.page-screen').forEach(page => {
        page.classList.add('hidden');
      });

      // Show target page
      const targetPage = document.getElementById(`page-${pageNumber}`);
      if (targetPage) {
        targetPage.classList.remove('hidden');
      }
    }

    function selectMenu(type) {
    playPopSFX();

    if (type === 'materi') {
        goToPage(6);
    } else {
        goToPage(16);
    }
}

    // Attach click sound to all buttons automatically
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => playPopSFX());
      });
    });
  </script>
</body>
</html>
